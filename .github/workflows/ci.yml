name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # ubuntu-latest ships Google Chrome, which scripts/pdf.ts uses
      # (channel: "chrome") — no browser download needed.
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - run: pnpm validate
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
